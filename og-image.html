<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Image — Emmalee Alexander</title>
<!--
  HOW TO EXPORT AS PNG:
  1. Open this file in Chrome
  2. Open DevTools (F12) → click the device toolbar icon (Ctrl+Shift+M / Cmd+Shift+M)
  3. Set dimensions to 1200 × 630
  4. Open the Command Palette (Ctrl+Shift+P / Cmd+Shift+P)
  5. Type "Capture screenshot" and press Enter
  6. Save the file as og-image.png in this folder
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    font-family: system-ui, -apple-system, sans-serif;
    background:
        radial-gradient(ellipse 55% 75% at 8% 95%, rgba(188, 107, 130, 0.14) 0%, transparent 70%),
        radial-gradient(ellipse 40% 52% at 82% 58%, rgba(188, 107, 130, 0.09) 0%, transparent 65%),
        #FAF7F4;
}

.grain {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.044;
    mix-blend-mode: soft-light;
    pointer-events: none;
    z-index: 8;
}

.bottom-rule {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: #E4D8DC;
    z-index: 5;
}

.text-zone {
    position: absolute;
    left: 72px;
    top: 0;
    bottom: 0;
    width: 560px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.eyebrow {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: #BC6B82;
    margin-bottom: 26px;
}

.name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 90px;
    line-height: 0.97;
    color: #1C1618;
    margin-bottom: 40px;
}

.separator {
    width: 48px;
    height: 1px;
    background: #E4D8DC;
    margin-bottom: 22px;
}

.tagline {
    font-size: 15px;
    font-weight: 400;
    color: #A08090;
    letter-spacing: 0.02em;
    line-height: 1.65;
}

.card {
    position: absolute;
    width: 272px;
    height: 155px;
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14), 0 2px 7px rgba(0, 0, 0, 0.09);
}

.card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 52px;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.20), transparent);
}

.card-1 {
    background: linear-gradient(140deg, #CBAFB7 0%, #A89098 100%);
    left: 814px;
    top: 213px;
    transform: rotate(-14deg);
}

.card-2 {
    background: linear-gradient(140deg, #C8B898 0%, #B4A282 100%);
    left: 839px;
    top: 241px;
    transform: rotate(-4deg);
}

.card-3 {
    background: linear-gradient(140deg, #9AB8AC 0%, #7E9E94 100%);
    left: 864px;
    top: 270px;
    transform: rotate(7deg);
}

</style>
</head>
<body>

<svg class="grain" aria-hidden="true">
    <filter id="grain-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#grain-filter)"/>
</svg>

<div class="bottom-rule"></div>

<div class="text-zone">
    <p class="eyebrow">✦&nbsp;&nbsp;Print Design &nbsp;·&nbsp; Frankfort, MI</p>
    <h1 class="name">Emmalee<br>Alexander</h1>
    <div class="separator"></div>
    <p class="tagline">Business cards &amp; flyers<br>made to be held onto.</p>
</div>

<div class="card card-1"></div>
<div class="card card-2"></div>
<div class="card card-3"></div>

</body>
</html>
